name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Create JARVIS project
        run: |

          mkdir -p app/src/main/java/com/jarvis/ai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.jarvis.ai"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.ai"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="JARVIS"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".JarvisAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/ai/MainActivity.java <<'EOF'
          package com.jarvis.ai;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView status;
              private Button startButton;
              private SpeechRecognizer speechRecognizer;
              private Intent speechIntent;
              private TextToSpeech tts;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  startButton = findViewById(R.id.startButton);

                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("hi", "IN"));
                      }
                  });

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              100
                      );
                  }

                  speechIntent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  );

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          "hi-IN"
                  );

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE,
                          "hi-IN"
                  );

                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);

                  speechRecognizer.setRecognitionListener(
                          new RecognitionListener() {

                      @Override
                      public void onReadyForSpeech(Bundle params) {
                          status.setText("🎤 JARVIS सुन रहा है...");
                      }

                      @Override
                      public void onBeginningOfSpeech() {
                          status.setText("🎤 बोलिए...");
                      }

                      @Override
                      public void onRmsChanged(float rmsdB) {}

                      @Override
                      public void onBufferReceived(byte[] buffer) {}

                      @Override
                      public void onEndOfSpeech() {
                          status.setText("समझ रहा हूँ...");
                      }

                      @Override
                      public void onError(int error) {
                          status.setText(
                                  "फिर से बोलने के लिए Start दबाएँ"
                          );
                      }

                      @Override
                      public void onResults(Bundle results) {

                          ArrayList<String> matches =
                                  results.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION
                                  );

                          if (matches != null && !matches.isEmpty()) {
                              String command = matches.get(0);
                              status.setText("आपने कहा: " + command);
                              executeCommand(command);
                          }
                      }

                      @Override
                      public void onPartialResults(Bundle partialResults) {}

                      @Override
                      public void onEvent(int eventType, Bundle params) {}
                  });

                  startButton.setOnClickListener(v -> startJarvis());
              }

              private void startJarvis() {

                  if (!isAccessibilityEnabled()) {
                      speak("पहले JARVIS Accessibility चालू कीजिए।");

                      try {
                          startActivity(
                                  new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          );
                      } catch (Exception e) {
                          status.setText(
                                  "Accessibility Settings नहीं खुल सकी।"
                          );
                      }

                      return;
                  }

                  speak("JARVIS तैयार है। कमांड बोलिए।");

                  new Handler().postDelayed(
                          () -> listen(),
                          1200
                  );
              }

              private void listen() {

                  if (speechRecognizer != null) {
                      speechRecognizer.cancel();
                      speechRecognizer.startListening(speechIntent);
                  }
              }

              private void executeCommand(String command) {

                  String c = command.toLowerCase(Locale.ROOT);

                  if (c.contains("youtube") ||
                          c.contains("यूट्यूब")) {

                      speak("YouTube खोल रहा हूँ।");

                      openApp("com.google.android.youtube");
                      return;
                  }

                  if (c.contains("whatsapp") ||
                          c.contains("व्हाट्सएप") ||
                          c.contains("व्हाट्स अप")) {

                      speak("WhatsApp खोल रहा हूँ।");

                      openApp("com.whatsapp");
                      return;
                  }

                  if (c.contains("chrome") ||
                          c.contains("क्रोम") ||
                          c.contains("browser") ||
                          c.contains("ब्राउज़र")) {

                      speak("Chrome खोल रहा हूँ।");

                      openApp("com.android.chrome");
                      return;
                  }

                  if (c.contains("home") ||
                          c.contains("होम")) {

                      speak("होम जा रहा हूँ।");

                      if (JarvisAccessibilityService.instance != null) {
                          JarvisAccessibilityService.instance
                                  .performGlobalAction(
                                          android.accessibilityservice
                                                  .AccessibilityService
                                                  .GLOBAL_ACTION_HOME
                                  );
                      }

                      return;
                  }

                  if (c.contains("back") ||
                          c.contains("वापस")) {

                      speak("वापस जा रहा हूँ।");

                      if (JarvisAccessibilityService.instance != null) {
                          JarvisAccessibilityService.instance
                                  .performGlobalAction(
                                          android.accessibilityservice
                                                  .AccessibilityService
                                                  .GLOBAL_ACTION_BACK
                                  );
                      }

                      return;
                  }

                  speak("मुझे यह कमांड समझ नहीं आई।");
              }

              private void openApp(String packageName) {

                  try {

                      Intent launchIntent =
                              getPackageManager()
                                      .getLaunchIntentForPackage(
                                              packageName
                                      );

                      if (launchIntent != null) {
                          startActivity(launchIntent);
                      } else {
                          speak("यह ऐप फोन में इंस्टॉल नहीं है।");
                      }

                  } catch (Exception e) {
                      speak("ऐप खोलने में समस्या हुई।");
                  }
              }

              private void speak(String text) {

                  status.setText(text);

                  if (tts != null) {
                      tts.speak(
                              text,
                              TextToSpeech.QUEUE_FLUSH,
                              null,
                              "JARVIS"
                      );
                  }
              }

              private boolean isAccessibilityEnabled() {

                  try {

                      String enabled =
                              Settings.Secure.getString(
                                      getContentResolver(),
                                      Settings.Secure
                                              .ENABLED_ACCESSIBILITY_SERVICES
                              );

                      return enabled != null &&
                              enabled.contains(
                                      getPackageName() +
                                      "/.JarvisAccessibilityService"
                              );

                  } catch (Exception e) {
                      return false;
                  }
              }

              @Override
              protected void onDestroy() {

                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/jarvis/ai/JarvisAccessibilityService.java <<'EOF'
          package com.jarvis.ai;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          public class JarvisAccessibilityService
                  extends AccessibilityService {

              public static JarvisAccessibilityService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="JARVIS"
                  android:textSize="40sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="20dp" />

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:text="JARVIS तैयार है"
                  android:textSize="18sp"
                  android:layout_marginBottom="30dp" />

              <Button
                  android:id="@+id/startButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🎤 START JARVIS"
                  android:textSize="18sp" />

          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">JARVIS</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/app_name"
              android:notificationTimeout="100" />
          EOF

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
